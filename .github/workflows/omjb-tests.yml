name: OMJB tests
on:
  pull_request:
    branches: [main]
    paths:
      - "omjb/**"
      - "tests/test_omjb.py"
      - "tests/test_guard_review.py"
      - "tests/test_downloaders.py"
      - "corpus/omjb_probes.json"
      - "pyproject.toml"
      - ".github/workflows/omjb-tests.yml"
  push:
    branches: [main]
    paths:
      - "omjb/**"
      - "tests/test_omjb.py"
      - "tests/test_guard_review.py"
      - "tests/test_downloaders.py"
      - "corpus/omjb_probes.json"
      - "pyproject.toml"
      - ".github/workflows/omjb-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p 'test_omjb.py' -v
      - run: python -m unittest discover -s tests -p 'test_guard_review.py' -v
      - run: python -m unittest discover -s tests -p 'test_downloaders.py' -v
