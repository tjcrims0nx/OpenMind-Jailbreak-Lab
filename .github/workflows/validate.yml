name: Validate benchmark
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile every Python source and test file
        run: python -m compileall -q modules src tests omjb
      - name: Validate benchmark
        run: |
          python -m src.validate data/benchmark_v0.3.jsonl
          python -m src.validate data/benchmark_v0.4.jsonl
          python -m src.validate data/benchmark_v0.5.jsonl
          python -m src.validate data/benchmark_v0.6.jsonl
          python -m src.validate data/benchmark_v0.6.1.jsonl
          python -m src.validate data/benchmark_v0.7.0.jsonl
          python -m src.validate data/benchmark_v0.8.0.jsonl
      - name: Audit benchmark quality
        run: python -m src.quality_audit data/benchmark_v0.8.0.jsonl
      - name: Smoke-test JB-002 module
        run: |
          python -m modules.jb002 list
          python -m modules.jb002 prompt JB002-01
          python -m modules.jb002 validate
          python -m modules.jb002 report
      - name: Smoke-test AI scanner module
        run: python -m modules.ai_scanner --help
      - name: Smoke-test Guardrail Lab module
        run: python -m modules.guardrail_lab --list
      - name: Smoke-test original source corpus browser
        run: python -m modules.original_source_corpus --search gemini
      - name: Smoke-test OMJB package and existing-suite adapter
        run: |
          python -m omjb.cli --help
          python -m omjb.cli --db /tmp/omjb-ci.sqlite run --suite guardrail-lab --case GL-001 --name ci-adapter-smoke --target echo
          python -m omjb.cli --db /tmp/omjb-ci.sqlite report 1
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
