[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmind-omjb"
version = "0.2.0"
description = "Bounded, provider-neutral AI evaluation harness"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
test = []

[project.scripts]
omjb = "omjb.cli:main"

[tool.setuptools.packages.find]
include = ["omjb*"]
